name: linux-mint-cinnamon image

# Railway runs prebuilt images on every plan, so the desktop ships as an image on GHCR
on:
  push:
    branches: [main]
    paths: ["linux-mint-cinnamon/**", ".github/workflows/linux-mint-cinnamon.yml"]
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: linux-mint-cinnamon
          push: true
          tags: |
            ghcr.io/nerminsabanovic31/linux-mint-cinnamon:latest
            ghcr.io/nerminsabanovic31/linux-mint-cinnamon:${{ github.sha }}
